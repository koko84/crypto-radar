<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<meta name="description" content="CryptoLens — Live crypto prices, portfolio tracker, price alerts and market insights.">
<title>CryptoLens</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236C5CE7'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white'>◆</text></svg>">
<style>
:root{--p:#6C5CE7;--a:#00D1B2;--bg:#0B0E14;--s:#141821;--t:#E6E9F0;--m:#8A93A6;--d:#FF5C7A;--ok:#22C55E;--bd:rgba(255,255,255,.08);--r:16px}
[data-theme="light"]{--bg:#F5F7FB;--s:#FFF;--t:#0B0E14;--m:#5B6474;--bd:rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:80px;min-height:100vh;background-image:radial-gradient(circle at 20% 0%,rgba(108,92,231,.18),transparent 40%),radial-gradient(circle at 80% 100%,rgba(0,209,178,.12),transparent 40%);background-attachment:fixed}
h1,h2,h3{margin:0 0 .5rem}
a{color:var(--a);text-decoration:none;cursor:pointer}
.muted{color:var(--m);font-size:.8rem}
.up{color:var(--ok)}.down{color:var(--d)}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;z-index:50;background:rgba(11,14,20,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);gap:8px;flex-wrap:wrap}
[data-theme="light"] .app-header{background:rgba(245,247,251,.75)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--a));color:#fff;font-size:1.1rem;flex-shrink:0}
.header-actions{display:flex;gap:6px;align-items:center;flex:1;justify-content:flex-end;min-width:0}
.header-actions input,.header-actions select,.header-actions button{background:var(--s);color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:.85rem;font-family:inherit}
#searchInput{width:120px;min-width:80px}
.header-actions button{cursor:pointer}
.global-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px}
.stat{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat strong{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;color:var(--m);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-size:.85rem;white-space:nowrap;cursor:pointer;font-family:inherit}
.tab.active{background:linear-gradient(135deg,var(--p),var(--a));color:#fff;border-color:transparent}
main{padding:0 16px}
.tab-panel{display:none}.tab-panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.featured{display:flex;gap:12px;overflow-x:auto;padding:8px 0 16px;scrollbar-width:none}
.featured::-webkit-scrollbar{display:none}
.featured-card{min-width:150px;background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:12px;cursor:pointer;transition:.2s;flex-shrink:0}
.featured-card:hover{transform:translateY(-2px);border-color:var(--p)}
.featured-card .sym{font-weight:700;font-size:.85rem;color:var(--m)}
.featured-card .price{font-size:1.05rem;margin:6px 0;font-weight:600}
.featured-card .chg{font-size:.8rem}
.market-controls{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.market-controls::-webkit-scrollbar{display:none}
.chip{background:var(--s);color:var(--m);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;font-size:.8rem;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip.active{background:var(--p);color:#fff;border-color:transparent}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:32px 1fr auto auto;gap:10px;align-items:center;background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;cursor:pointer;transition:.2s}
.row:hover{border-color:var(--p)}
.row img{width:28px;height:28px;border-radius:50%}
.row .name{font-weight:600;font-size:.85rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .symbol{color:var(--m);font-size:.72rem;text-transform:uppercase}
.row .price{font-weight:600;text-align:end;font-size:.85rem}
.row .change{font-size:.75rem;text-align:end;min-width:55px}
.watch-btn,.del-btn{background:transparent;border:none;color:var(--m);font-size:1.2rem;cursor:pointer;padding:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.watch-btn:hover,.del-btn:hover{background:var(--bd);color:var(--p)}
.portfolio-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;background:var(--s);border:1px solid var(--bd);border-radius:var(--r);padding:10px}
.form-row select,.form-row input{flex:1;min-width:90px;background:var(--bg);color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:.85rem;font-family:inherit}
.form-row button{background:linear-gradient(135deg,var(--p),var(--a));color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.85rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:100;padding:16px;backdrop-filter:blur(6px)}
.modal.hidden{display:none}
.modal-card{background:var(--s);border:1px solid var(--bd);border-radius:var(--r);width:min(600px,100%);max-height:90vh;overflow:auto;padding:20px;position:relative}
.modal-close{position:absolute;top:12px;left:12px;background:transparent;border:none;color:var(--m);font-size:1.2rem;cursor:pointer;width:32px;height:32px}
.modal-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.legal{line-height:1.7;font-size:.9rem}
.legal h2{font-size:1rem;margin-top:16px;color:var(--p)}
.app-footer{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:20px 16px;font-size:.75rem;color:var(--m);border-top:1px solid var(--bd);margin-top:24px}
.app-footer a:hover{color:var(--p)}
.empty{text-align:center;padding:30px 20px;color:var(--m);font-size:.85rem}
@media(max-width:480px){#searchInput{width:90px}.featured-card{min-width:130px}}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand"><div class="logo">◆</div><span id="appName">CryptoLens</span></div>
  <div class="header-actions">
    <input id="searchInput" type="search" placeholder="Search…" aria-label="Search">
    <select id="langSelect" aria-label="Language">
      <option value="ar">AR</option><option value="en">EN</option><option value="fr">FR</option>
      <option value="es">ES</option><option value="pt">PT</option><option value="tr">TR</option>
    </select>
    <button id="themeToggle" aria-label="Theme">🌙</button>
  </div>
</header>

<section class="global-bar">
  <div class="stat"><span class="muted" data-i18n="marketCap">Market Cap</span><strong id="gCap">—</strong></div>
  <div class="stat"><span class="muted" data-i18n="volume">24h Vol</span><strong id="gVol">—</strong></div>
  <div class="stat"><span class="muted" data-i18n="btcDom">BTC Dominance</span><strong id="gBtc">—</strong></div>
</section>

<nav class="tabs">
  <button class="tab active" data-tab="market" data-i18n="market">📈 Market</button>
  <button class="tab" data-tab="watchlist" data-i18n="watchlist">⭐ Watchlist</button>
  <button class="tab" data-tab="portfolio" data-i18n="portfolio">💼 Portfolio</button>
  <button class="tab" data-tab="alerts" data-i18n="alerts">🔔 Alerts</button>
</nav>

<main>
  <section id="tab-market" class="tab-panel active">
    <div class="featured" id="featuredRow"></div>
    <div class="market-controls">
      <button class="chip active" data-filter="all" data-i18n="all">All</button>
      <button class="chip" data-filter="gainers" data-i18n="gainers">Gainers</button>
      <button class="chip" data-filter="losers" data-i18n="losers">Losers</button>
      <button class="chip" data-filter="volume" data-i18n="topVol">Top Volume</button>
    </div>
    <div id="marketList" class="list"><div class="empty">Loading…</div></div>
  </section>

  <section id="tab-watchlist" class="tab-panel">
    <div id="watchlistList" class="list"><div class="empty">—</div></div>
  </section>

  <section id="tab-portfolio" class="tab-panel">
    <div class="portfolio-summary">
      <div class="stat"><span class="muted" data-i18n="totalValue">Total Value</span><strong id="pfTotal">$0</strong></div>
      <div class="stat"><span class="muted" data-i18n="pnl">24h P/L</span><strong id="pfPnl">—</strong></div>
    </div>
    <form id="portfolioForm" class="form-row">
      <select id="pfCoin" required></select>
      <input id="pfAmount" type="number" step="any" placeholder="Amount" required>
      <input id="pfPrice" type="number" step="any" placeholder="Buy price (USD)" required>
      <button type="submit" data-i18n="add">Add</button>
    </form>
    <div id="portfolioList" class="list"><div class="empty">—</div></div>
  </section>

  <section id="tab-alerts" class="tab-panel">
    <form id="alertForm" class="form-row">
      <select id="alertCoin" required></select>
      <select id="alertDir">
        <option value="above" data-i18n="above">Above</option>
        <option value="below" data-i18n="below">Below</option>
      </select>
      <input id="alertPrice" type="number" step="any" placeholder="Price (USD)" required>
      <button type="submit" data-i18n="create">Create</button>
    </form>
    <div id="alertsList" class="list"><div class="empty">—</div></div>
  </section>
</main>

<footer class="app-footer">
  <a onclick="showLegal('privacy')" data-i18n="privacy">Privacy</a>
  <a onclick="showLegal('terms')" data-i18n="terms">Terms</a>
  <a onclick="showLegal('disclaimer')" data-i18n="disclaimer">Disclaimer</a>
  <span id="version">v1.0.0</span>
</footer>

<div id="coinModal" class="modal hidden">
  <div class="modal-card">
    <button id="modalClose" class="modal-close">✕</button>
    <h2 id="modalTitle">—</h2>
    <div id="chart" style="height:280px;margin-top:12px"></div>
    <div id="modalStats" class="modal-stats"></div>
  </div>
</div>

<div id="legalModal" class="modal hidden">
  <div class="modal-card">
    <button id="legalClose" class="modal-close">✕</button>
    <div id="legalContent" class="legal"></div>
  </div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<script>const CFG = {
  name:"CryptoLens", version:"1.0.0",
  api:"https://api.coingecko.com/api/v3",
  cacheTTL:60000,
  defaultLang:"ar",
  featured:["bitcoin","ethereum","solana","binancecoin","ripple","cardano"]
};

const I18N = {
  en:{market:"Market",watchlist:"Watchlist",portfolio:"Portfolio",alerts:"Alerts",search:"Search…",
      totalValue:"Total Value",pnl:"24h P/L",add:"Add",create:"Create",above:"Above",below:"Below",
      marketCap:"Market Cap",volume:"24h Vol",btcDom:"BTC Dominance",all:"All",gainers:"Gainers",
      losers:"Losers",topVol:"Top Volume",privacy:"Privacy",terms:"Terms",disclaimer:"Disclaimer"},
  ar:{market:"السوق",watchlist:"المراقبة",portfolio:"المحفظة",alerts:"التنبيهات",search:"بحث…",
      totalValue:"القيمة الإجمالية",pnl:"ربح/خسارة",add:"أضف",create:"أنشئ",above:"فوق",below:"تحت",
      marketCap:"القيمة السوقية",volume:"حجم 24س",btcDom:"هيمنة BTC",all:"الكل",gainers:"الرابحون",
      losers:"الخاسرون",topVol:"أعلى حجم",privacy:"الخصوصية",terms:"الشروط",disclaimer:"إخلاء المسؤولية"},
  fr:{market:"Marché",watchlist:"Suivi",portfolio:"Portefeuille",alerts:"Alertes",search:"Rechercher…",
      totalValue:"Valeur totale",pnl:"P/L 24h",add:"Ajouter",create:"Créer",above:"Au-dessus",below:"En-dessous",
      marketCap:"Capitalisation",volume:"Vol 24h",btcDom:"Domination BTC",all:"Tout",gainers:"Gagnants",
      losers:"Perdants",topVol:"Top Volume",privacy:"Confidentialité",terms:"Conditions",disclaimer:"Avertissement"},
  es:{market:"Mercado",watchlist:"Lista",portfolio:"Cartera",alerts:"Alertas",search:"Buscar…",
      totalValue:"Valor total",pnl:"P/L 24h",add:"Añadir",create:"Crear",above:"Encima",below:"Debajo",
      marketCap:"Cap. mercado",volume:"Vol 24h",btcDom:"Dominancia BTC",all:"Todo",gainers:"Ganadores",
      losers:"Perdedores",topVol:"Top Volumen",privacy:"Privacidad",terms:"Términos",disclaimer:"Aviso"},
  pt:{market:"Mercado",watchlist:"Lista",portfolio:"Carteira",alerts:"Alertas",search:"Buscar…",
      totalValue:"Valor total",pnl:"P/L 24h",add:"Adicionar",create:"Criar",above:"Acima",below:"Abaixo",
      marketCap:"Cap. mercado",volume:"Vol 24h",btcDom:"Dominância BTC",all:"Tudo",gainers:"Ganhadores",
      losers:"Perdedores",topVol:"Top Volume",privacy:"Privacidade",terms:"Termos",disclaimer:"Aviso"},
  tr:{market:"Piyasa",watchlist:"İzleme",portfolio:"Portföy",alerts:"Uyarılar",search:"Ara…",
      totalValue:"Toplam Değer",pnl:"24s K/Z",add:"Ekle",create:"Oluştur",above:"Üstünde",below:"Altında",
      marketCap:"Piyasa Değeri",volume:"24s Hacim",btcDom:"BTC Dominans",all:"Tümü",gainers:"Kazananlar",
      losers:"Kaybedenler",topVol:"Top Hacim",privacy:"Gizlilik",terms:"Şartlar",disclaimer:"Uyarı"}
};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const fmt = n => n==null?'—':n>=1e9?'$'+(n/1e9).toFixed(2)+'B':n>=1e6?'$'+(n/1e6).toFixed(2)+'M':n>=1?'$'+n.toLocaleString('en-US',{maximumFractionDigits:2}):'$'+n.toFixed(6);
const save = (k,v) => localStorage.setItem(k,JSON.stringify(v));
const load = (k,d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e){ return d; } };
function t(k){ const l=localStorage.getItem('lang')||CFG.defaultLang; return (I18N[l]&&I18N[l][k])||I18N.en[k]||k; }
function applyLang(){
  const l=localStorage.getItem('lang')||CFG.defaultLang;
  document.documentElement.lang=l;
  document.documentElement.dir=l==='ar'?'rtl':'ltr';
  $$('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  $('#searchInput').placeholder=t('search');
}

const state={
  coins:[],
  filter:'all',
  watchlist:load('watchlist',[]),
  portfolio:load('portfolio',[]),
  alerts:load('alerts',[])
};

const cache=new Map();
async function api(path,ttl=CFG.cacheTTL){
  const hit=cache.get(path);
  if(hit&&Date.now()-hit.t<ttl)return hit.data;
  const r=await fetch(CFG.api+path);
  if(!r.ok)throw new Error('API '+r.status);
  const d=await r.json();
  cache.set(path,{t:Date.now(),data:d});
  return d;
}

async function renderGlobal(){
  try{
    const g=(await api('/global',120000)).data;
    $('#gCap').textContent=fmt(g.total_market_cap.usd);
    $('#gVol').textContent=fmt(g.total_volume.usd);
    $('#gBtc').textContent=g.market_cap_percentage.btc.toFixed(1)+'%';
  }catch(e){}
}

function renderFeatured(){
  const arr=CFG.featured.map(id=>state.coins.find(c=>c.id===id)).filter(Boolean);
  $('#featuredRow').innerHTML=arr.map(c=>{
    const ch=c.price_change_percentage_24h??0;
    return `<div class="featured-card" data-id="${c.id}">
      <div class="sym">${c.symbol.toUpperCase()}</div>
      <div class="price">${fmt(c.current_price)}</div>
      <div class="chg ${ch>=0?'up':'down'}">${ch>=0?'▲':'▼'} ${Math.abs(ch).toFixed(2)}%</div>
    </div>`;
  }).join('');
  $$('#featuredRow .featured-card').forEach(el=>el.onclick=()=>openCoin(el.dataset.id));
}

function coinRow(c){
  const ch=c.price_change_percentage_24h??0;
  const w=state.watchlist.includes(c.id);
  return `<div class="row" data-id="${c.id}">
    <img src="${c.image}" alt="${c.symbol}" loading="lazy">
    <div><div class="name">${c.name}</div><div class="symbol">${c.symbol}</div></div>
    <div><div class="price">${fmt(c.current_price)}</div><div class="change ${ch>=0?'up':'down'}">${ch>=0?'▲':'▼'} ${Math.abs(ch).toFixed(2)}%</div></div>
    <button class="watch-btn" data-wid="${c.id}">${w?'★':'☆'}</button>
  </div>`;
}

function bindRows(sel){
  $$(sel+' .row').forEach(el=>el.onclick=e=>{
    if(e.target.classList.contains('watch-btn'))return;
    openCoin(el.dataset.id);
  });
  $$(sel+' .watch-btn').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const id=b.dataset.wid;
    const i=state.watchlist.indexOf(id);
    if(i>=0)state.watchlist.splice(i,1);else state.watchlist.push(id);
    save('watchlist',state.watchlist);
    renderMarket();renderWatchlist();
  });
}

function renderMarket(){
  let arr=[...state.coins];
  if(state.filter==='gainers')arr=arr.filter(c=>(c.price_change_percentage_24h??0)>0).sort((a,b)=>b.price_change_percentage_24h-a.price_change_percentage_24h);
  if(state.filter==='losers')arr=arr.filter(c=>(c.price_change_percentage_24h??0)<0).sort((a,b)=>a.price_change_percentage_24h-b.price_change_percentage_24h);
  if(state.filter==='volume')arr.sort((a,b)=>b.total_volume-a.total_volume);
  $('#marketList').innerHTML=arr.slice(0,100).map(coinRow).join('')||'<div class="empty">No data</div>';
  bindRows('#marketList');
}

function renderWatchlist(){
  const arr=state.coins.filter(c=>state.watchlist.includes(c.id));
  $('#watchlistList').innerHTML=arr.length?arr.map(coinRow).join(''):'<div class="empty">Tap ☆ on any coin to add it here</div>';
  bindRows('#watchlistList');
}

function renderPortfolio(){
  const map=Object.fromEntries(state.coins.map(c=>[c.id,c]));
  let total=0,cost=0;
  $('#portfolioList').innerHTML=state.portfolio.map((p,i)=>{
    const c=map[p.coin];if(!c)return '';
    const v=p.amount*c.current_price, cs=p.amount*p.buyPrice;
    total+=v;cost+=cs;
    const diff=v-cs;
    return `<div class="row">
      <img src="${c.image}" alt="">
      <div><div class="name">${c.name}</div><div class="symbol">${p.amount} × ${fmt(p.buyPrice)}</div></div>
      <div><div class="price">${fmt(v)}</div><div class="change ${diff>=0?'up':'down'}">${diff>=0?'+':''}${fmt(diff)}</div></div>
      <button class="del-btn" data-pi="${i}">✕</button>
    </div>`;
  }).join('')||'<div class="empty">Portfolio is empty</div>';
  $('#pfTotal').textContent=fmt(total);
  const pnl=total-cost;
  $('#pfPnl').textContent=fmt(pnl);
  $('#pfPnl').className=pnl>=0?'up':'down';
  $$('#portfolioList .del-btn').forEach(b=>b.onclick=()=>{
    state.portfolio.splice(+b.dataset.pi,1);
    save('portfolio',state.portfolio);
    renderPortfolio();
  });
}

function renderAlerts(){
  const map=Object.fromEntries(state.coins.map(c=>[c.id,c]));
  $('#alertsList').innerHTML=state.alerts.map((a,i)=>{
    const c=map[a.coin];
    return `<div class="row">
      <img src="${c?.image||''}" alt="">
      <div><div class="name">${c?.name||a.coin}</div><div class="symbol">${a.dir==='above'?'↑':'↓'} ${fmt(a.price)}</div></div>
      <div>${a.triggered?'✅':'⏳'}</div>
      <button class="del-btn" data-ai="${i}">✕</button>
    </div>`;
  }).join('')||'<div class="empty">No alerts yet</div>';
  $$('#alertsList .del-btn').forEach(b=>b.onclick=()=>{
    state.alerts.splice(+b.dataset.ai,1);
    save('alerts',state.alerts);
    renderAlerts();
  });
}

function checkAlerts(){
  let ch=false;
  state.alerts.forEach(a=>{
    if(a.triggered)return;
    const c=state.coins.find(x=>x.id===a.coin);if(!c)return;
    const hit=(a.dir==='above'&&c.current_price>=a.price)||(a.dir==='below'&&c.current_price<=a.price);
    if(hit){a.triggered=true;ch=true;notify(`${c.name} is ${a.dir} ${fmt(a.price)}`,`Now: ${fmt(c.current_price)}`);}
  });
  if(ch){save('alerts',state.alerts);renderAlerts();}
}

function notify(title,body){
  if(!('Notification' in window))return;
  if(Notification.permission==='granted')new Notification(title,{body,icon:'./icon-192.png'});
  else if(Notification.permission!=='denied')Notification.requestPermission().then(p=>{if(p==='granted')new Notification(title,{body});});
}
let chartInstance=null;
async function openCoin(id){
  $('#coinModal').classList.remove('hidden');
  $('#modalTitle').textContent='Loading…';
  $('#chart').innerHTML='';
  $('#modalStats').innerHTML='';
  try{
    const c=state.coins.find(x=>x.id===id);
    if(c)$('#modalTitle').textContent=`${c.name} (${c.symbol.toUpperCase()})`;
    const d=await api(`/coins/${id}/market_chart?vs_currency=usd&days=1`,120000);
    const prices=d.prices.map(p=>({time:Math.floor(p[0]/1000),value:p[1]}));
    if(chartInstance){try{chartInstance.remove();}catch(e){}}
    chartInstance=LightweightCharts.createChart($('#chart'),{
      layout:{background:{color:'transparent'},textColor:'#8A93A6'},
      grid:{vertLines:{color:'rgba(128,128,128,.08)'},horzLines:{color:'rgba(128,128,128,.08)'}},
      rightPriceScale:{borderColor:'rgba(128,128,128,.15)'},
      timeScale:{borderColor:'rgba(128,128,128,.15)'},
      height:280
    });
    const line=chartInstance.addAreaSeries({lineColor:'#6C5CE7',topColor:'rgba(108,92,231,.4)',bottomColor:'rgba(108,92,231,0)',lineWidth:2});
    line.setData(prices);
    chartInstance.timeScale().fitContent();
    if(c){
      const ch=c.price_change_percentage_24h??0;
      $('#modalStats').innerHTML=`
        <div class="stat"><span class="muted">Price</span><strong>${fmt(c.current_price)}</strong></div>
        <div class="stat"><span class="muted">24h</span><strong class="${ch>=0?'up':'down'}">${ch.toFixed(2)}%</strong></div>
        <div class="stat"><span class="muted">Mkt Cap</span><strong>${fmt(c.market_cap)}</strong></div>
        <div class="stat"><span class="muted">Volume</span><strong>${fmt(c.total_volume)}</strong></div>`;
    }
  }catch(e){$('#modalTitle').textContent='Error';console.warn(e);}
}

  privacy:`<h1>Privacy Policy</h1><p class="muted">Last updated: 2026</p>
    <h2>Data We Collect</h2><p>CryptoLens does not collect or transmit any personal data. Your watchlist, portfolio and alerts are stored only on your device (localStorage).</p>
    <h2>Third-Party Services</h2><p>We use the public CoinGecko API to fetch market data. Please review CoinGecko's privacy policy.</p>
    <h2>Ads</h2><p>No ads are shown at this time.</p>
    <h2>Contact</h2><p>Email: support@yourdomain.com</p>`,
  terms:`<h1>Terms of Service</h1><p class="muted">Last updated: 2026</p>
    <h2>Use of Service</h2><p>CryptoLens is provided "as is" for informational purposes. You agree not to misuse the application.</p>
    <h2>No Warranty</h2><p>We do not guarantee the accuracy, completeness or timeliness of any market data displayed.</p>
    <h2>Limitation of Liability</h2><p>We are not liable for any financial losses resulting from use of this app.</p>`,
  disclaimer:`<h1>Financial Disclaimer</h1><p class="muted">Last updated: 2026</p>
    <p>All information provided by CryptoLens is for informational and educational purposes only and does not constitute financial, investment, trading or any other advice.</p>
    <p>Cryptocurrency markets are highly volatile. Always do your own research and consult a qualified financial advisor before making any investment decisions.</p>
    <p>CryptoLens is not a broker, exchange or financial institution and does not facilitate trading or hold user funds.</p>`
};
function showLegal(type){
  $('#legalContent').innerHTML=LEGAL[type]||'';
  $('#legalModal').classList.remove('hidden');
}

function fillSelects(){
  const opts=state.coins.slice(0,100).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  if($('#pfCoin'))$('#pfCoin').innerHTML=opts;
  if($('#alertCoin'))$('#alertCoin').innerHTML=opts;
}

function bindUI(){
  $$('.tab').forEach(t=>t.onclick=()=>{
    $$('.tab').forEach(x=>x.classList.remove('active'));
    $$('.tab-panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    $('#tab-'+t.dataset.tab).classList.add('active');
  });
  $$('.chip').forEach(c=>c.onclick=()=>{
    $$('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    state.filter=c.dataset.filter;
    renderMarket();
  });
  $('#searchInput').oninput=e=>{
    const q=e.target.value.toLowerCase().trim();
    if(!q)return renderMarket();
    const filtered=state.coins.filter(c=>c.name.toLowerCase().includes(q)||c.symbol.toLowerCase().includes(q));
    $('#marketList').innerHTML=filtered.map(coinRow).join('')||'<div class="empty">No results</div>';
    bindRows('#marketList');
  };
  $('#themeToggle').onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
    document.documentElement.setAttribute('data-theme',cur);
    localStorage.setItem('theme',cur);
    $('#themeToggle').textContent=cur==='light'?'☀️':'🌙';
  };
  $('#langSelect').onchange=e=>{
    localStorage.setItem('lang',e.target.value);
    applyLang();renderMarket();renderWatchlist();
  };
  $('#modalClose').onclick=()=>$('#coinModal').classList.add('hidden');
  $('#legalClose').onclick=()=>$('#legalModal').classList.add('hidden');
  $('#portfolioForm').onsubmit=e=>{
    e.preventDefault();
    const coin=$('#pfCoin').value,amount=parseFloat($('#pfAmount').value),buyPrice=parseFloat($('#pfPrice').value);
    if(!coin||!amount||!buyPrice)return;
    state.portfolio.push({coin,amount,buyPrice});
    save('portfolio',state.portfolio);
    e.target.reset();renderPortfolio();
  };
  $('#alertForm').onsubmit=e=>{
    e.preventDefault();
    const coin=$('#alertCoin').value,dir=$('#alertDir').value,price=parseFloat($('#alertPrice').value);
    if(!coin||!price)return;
    if(Notification.permission==='default')Notification.requestPermission();
    state.alerts.push({coin,dir,price,triggered:false});
    save('alerts',state.alerts);
    e.target.reset();renderAlerts();
  };
}

async function boot(){
  $('#appName').textContent=CFG.name;
  $('#version').textContent='v'+CFG.version;
  const th=localStorage.getItem('theme')||'dark';
  document.documentElement.setAttribute('data-theme',th);
  $('#themeToggle').textContent=th==='light'?'☀️':'🌙';
  const lg=localStorage.getItem('lang')||CFG.defaultLang;
  $('#langSelect').value=lg;
  applyLang();
  bindUI();
  try{
    state.coins=await api('/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=150&page=1&sparkline=false&price_change_percentage=24h');
    renderGlobal();renderFeatured();renderMarket();renderWatchlist();renderPortfolio();renderAlerts();fillSelects();checkAlerts();
  }catch(e){
    $('#marketList').innerHTML='<div class="empty">Failed to load data. Check connection.</div>';
    console.warn(e);
  }
  setInterval(async()=>{
    try{
      state.coins=await api('/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=150&page=1&sparkline=false&price_change_percentage=24h',30000);
      renderMarket();renderWatchlist();renderPortfolio();renderAlerts();renderGlobal();checkAlerts();
    }catch(e){}
  },60000);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

boot();
</script>
</body>
</html>
